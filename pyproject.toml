# setuptools 工具进行构建和安装。
#
# pip 负责安装，
# setuptools 负责告诉 pip：
#
#   项目如何构建
#   Python Package 在哪里
#
# [build-system]
#     描述构建项目需要什么。
#
# [project].dependencies
#     描述项目核心运行时需要什么。
#
# [project.optional-dependencies]
#     描述开发 / Demo 等可选依赖。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


# ==========================================================
# 项目元信息
# ==========================================================

[project]
name = "enterprise-rag-compliance"
version = "0.1.0"
description = "企业 AI 合规与应用规范 RAG 助手"
readme = "README.md"
requires-python = ">=3.11,<3.12"


# ==========================================================
# 核心运行依赖
#
# 这些依赖用于：
#
#   Ingestion
#   Embedding
#   Retrieval
#   Rerank
#   Qdrant
#   LLM
#   FastAPI Backend
#
# Streamlit 不属于后端核心依赖，
# 因此不会放在这里。
# ==========================================================

dependencies = [
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "PyYAML>=6.0,<7.0",
    "FlagEmbedding",
    "qdrant-client>=1.14,<2.0",
    "jieba>=0.42,<1.0",
    "rank-bm25>=0.2,<1.0",
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi",
    "uvicorn[standard]",
]


# ==========================================================
# 可选依赖
# ==========================================================

[project.optional-dependencies]

# 开发 / 测试依赖。
dev = [
    "pytest>=8.0,<9.0",
]

# Streamlit Demo 依赖。
#
# requests：
#     demo/api_client.py 使用它通过 HTTP 调用 FastAPI。
#
# streamlit：
#     只负责 Demo UI，
#     不直接初始化 RAG Runtime。
demo = [
    "requests>=2.31,<3.0",
    "streamlit>=1.37,<2.0",
]


# ==========================================================
# setuptools Package Discovery
#
# 项目使用 src-layout：
#
#   src/
#       enterprise_rag/
#
# 因此告诉 setuptools 从 src/ 查找 Python Package。
# ==========================================================

[tool.setuptools.packages.find]
where = ["src"]