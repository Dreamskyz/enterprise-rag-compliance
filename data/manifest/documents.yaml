  # ==========================================================
  # 4. Qdrant 官方技术文档
  # ==========================================================
  #
  # Qdrant 官网本身同样是公开资料。
  #
  # 当前人为设置：
  #
  #     access_level: developer
  #
  # 用于模拟企业内部 RAG 系统中的：
  #
  #     “向量数据库 / Retrieval 技术规范
  #      仅研发人员可访问”
  #
  # 这是 synthetic ACL policy，
  # 不是 Qdrant 官方文档真实的访问限制。
  #
  # Qdrant Loader 会：
  #
  # 1. 从 article.documentation-article
  #    提取真正技术正文；
  #
  # 2. 保留 Heading / Paragraph / List；
  #
  # 3. 保留重要 <aside> 技术提示；
  #
  # 4. 对重复 SDK 示例进行 Corpus Curating，
  #    当前主要保留：
  #
  #       JSON
  #       HTTP
  #       Python
  #
  # 5. 最终转换成统一 Markdown-like
  #    structured text，
  #    进入 Generic Parser / Chunker。
  #
  # ==========================================================

